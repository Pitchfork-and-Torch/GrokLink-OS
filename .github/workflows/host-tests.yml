name: host-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CMake host tests
        run: |
          cmake -S . -B build-ci -DGLK_PLATFORM_HOST=ON -DGLK_BUILD_TESTS=ON
          cmake --build build-ci
          ctest --test-dir build-ci --output-on-failure
      - name: Bridge pytest
        run: |
          python -m pip install -e "bridge/[dev]"
          python -m pytest bridge/tests -q
        env:
          PYTHONPATH: bridge
